name: Scheduled Codebase Hygiene

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hygiene-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Type Check & Linter
        id: typecheck
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          npm run typecheck --if-present
          npm run lint --if-present

      - name: Run App Test Suite
        id: tests
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: npm test --if-present

      - name: Run Factory Verification Suite
        id: factory_tests
        if: hashFiles('tests/test-scripts.sh') != ''
        continue-on-error: true
        run: |
          chmod +x .factory/*.sh .factory/bin/gh .factory/postgres/*.sh .factory/docker/*.sh tests/test-scripts.sh
          node --test tests/*.test.mjs
          ./tests/test-scripts.sh

      - name: Dispatch Hygiene Issue on Failures
        if: steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.factory_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "chore(hygiene): scheduled audit detected regressions" \
            --label "hygiene,bug" \
            --body "The scheduled weekly hygiene audit detected failures in typecheck, lint, or tests (Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Please assign to an idle worker for remediation."
